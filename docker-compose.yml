services:
  mongo:
    image: mongo:8.0
    container_name: recing-mongo
    ports:
      - "27017:27017"
    volumes:
      - recing-mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: recing
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/recing --quiet
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  recing-mongo-data:
