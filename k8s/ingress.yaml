apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recing-ingress
  annotations:
    # Traefik annotations (k3s uses Traefik by default)
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: recing.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: recing-web
            port:
              number: 80
