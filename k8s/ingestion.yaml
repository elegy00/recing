apiVersion: apps/v1
kind: Deployment
metadata:
  name: recing-ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recing-ingestion
  template:
    metadata:
      labels:
        app: recing-ingestion
    spec:
      containers:
      - name: ingestion
        image: ghcr.io/elegy00/recing/ingestion:latest
        env:
        - name: WEB_API_URL
          value: "http://recing-web:80"
        - name: LLM_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: recing-secrets
              key: llm-endpoint
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: recing-secrets
              key: api-key
        - name: LLM_MODEL
          value: "qwen3.6"
        - name: MAX_CONTENT_CHARS
          value: "60000"
