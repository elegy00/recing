<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recing — All Recipes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-serif: 'EB Garamond', Georgia, serif;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --color-text-primary: #1a1a1a;
            --color-text-secondary: #6b7280;
            --color-border: #9ca3af;
            --color-accent: #D9665B;
            --color-bg-canvas: #f5f4f0;
            --color-white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background: var(--color-bg-canvas);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header bar ─────────────────────────────── */
        .header {
            background: var(--color-white);
            border-bottom: 1px solid var(--color-border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header__logo {
            font-family: var(--font-serif);
            font-size: 1.375rem;
            color: var(--color-text-primary);
            text-decoration: none;
        }

        .header__nav { display: flex; align-items: center; gap: 2rem; }

        .header__link {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            text-decoration: none;
        }

        .header__nav-item--active {
            position: relative;
            color: var(--color-text-primary);
            font-weight: 500;
        }

        .header__nav-item--active::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            bottom: -4px;
            height: 3px;
            background: var(--color-accent);
            border-radius: 2px;
        }

        /* ── Main content ───────────────────────────── */
        .main {
            flex: 1;
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            padding: 3rem 1.5rem 2rem;
        }

        /* ── Page title ─────────────────────────────── */
        .page-title {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 1rem;
        }

        /* ── Divider ────────────────────────────────── */
        .divider {
            border: none;
            border-top: 1px solid var(--color-border);
            margin: 1.25rem 0;
        }

        /* ── Recipe list ────────────────────────────── */
        .recipe-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .recipe-card {
            background: var(--color-white);
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            text-decoration: none;
            color: inherit;
            transition: box-shadow 150ms ease;
        }

        .recipe-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .recipe-name {
            font-weight: 500;
            color: var(--color-text-primary);
            margin-bottom: 0.25rem;
        }

        .recipe-url {
            font-size: 0.8125rem;
            color: var(--color-text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
            display: block;
        }

        /* ── Empty state ────────────────────────────── */
        .empty-state {
            color: var(--color-text-secondary);
            font-size: 0.9375rem;
            padding: 2rem 0;
        }

        /* ── Footer ─────────────────────────────────── */
        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            padding: 1.5rem;
        }
    </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────── -->
<header class="header">
    <a href="/" class="header__logo">Recing</a>
    <nav class="header__nav">
        <a href="/" class="header__link">Submit</a>
        <span class="header__link header__nav-item--active">Recipes</span>
    </nav>
</header>

<!-- ── Main content ────────────────────────────────── -->
<main class="main">
    <h1 class="page-title">ALL RECIPES</h1>

    <hr class="divider">

    <!-- Recipe list -->
    <ul class="recipe-list" th:if="${#lists.size(recipes) > 0}">
        <li th:each="job : ${recipes}">
            <a th:href="@{/recipes/{id}(id=${job.id})}" class="recipe-card">
                <div class="recipe-name" th:text="${job.result.recipeName}">Recipe Name</div>
                <span class="recipe-url" th:title="${job.url}" th:text="${job.url}">https://example.com/recipe</span>
            </a>
        </li>
    </ul>

    <!-- Empty state -->
    <p class="empty-state" th:if="${#lists.isEmpty(recipes)}">No recipes yet — submit a URL to get started.</p>
</main>

<!-- ── Footer ──────────────────────────────────────── -->
<footer class="footer">© 2026 Recing · Terms · Help</footer>

</body>
</html>
