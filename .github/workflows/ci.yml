name: CI — Build & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write   # GHCR publish

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository_owner }}/recing

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: recing
          POSTGRES_USER: recing
          POSTGRES_PASSWORD: recing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "psql -U recing -d recing -c 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Run database migrations
        run: POSTGRES_URL=postgresql://recing:recing@localhost:5432/recing pnpm -C packages/migrate migrate
      - name: Run tests
        run: |-
          export TEST_POSTGRES_URL=postgresql://recing:recing@localhost:5432/recing
          pnpm test

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        run: |
          HELM_VERSION=v3.15.2
          curl -fsSL https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Lint chart
        run: helm lint helm/recing/
      - name: Template render (verify)
        run: |
          helm template test-release helm/recing/ \
            --set secrets.llmEndpoint=https://api.example.com \
            --set secrets.apiKey=dummy \
            -n recing > /dev/null

  build:
    needs: [test, helm]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git describe

      - name: Determine version
        id: version
        run: |
          TAG=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "Version: $TAG"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/web:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/web:latest

      - name: Build & push ingestion
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ingestion
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/ingestion:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/ingestion:latest

      - name: Build & push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.migrate
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/migrate:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/migrate:latest
