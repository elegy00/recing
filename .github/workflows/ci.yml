name: CI — Build, Publish & Helm Sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write   # Create tags + sync commits to helm values
  packages: write   # GHCR publish

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository_owner }}/recing

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: recing
          POSTGRES_USER: recing
          POSTGRES_PASSWORD: recing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "psql -U recing -d recing -c 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Run database migrations
        run: POSTGRES_URL=postgresql://recing:recing@localhost:5432/recing pnpm -C packages/migrate migrate
      - name: Run tests
        run: |-
          export TEST_POSTGRES_URL=postgresql://recing:recing@localhost:5432/recing
          pnpm test

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        run: |
          HELM_VERSION=v3.15.2
          curl -fsSL https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Lint chart
        run: helm lint helm/recing/
      - name: Template render (verify)
        run: |
          helm template test-release helm/recing/ \
            --set secrets.llmEndpoint=https://api.example.com \
            --set secrets.apiKey=dummy \
            -n recing > /dev/null

  build:
    needs: [test, helm]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git describe

      - name: Determine next version
        id: version
        run: |
          # Find the latest v* tag, parse MAJOR.MINOR.PATCH, bump PATCH
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1 || true)
          if [[ -n "$LATEST_TAG" ]]; then
            # Strip leading 'v'
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            PATCH=$((PATCH + 1))
          else
            MAJOR=0; MINOR=0; PATCH=1
          fi
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_MAJOR=$MAJOR" >> $GITHUB_OUTPUT
          echo "VERSION_MINOR=$MINOR" >> $GITHUB_OUTPUT
          echo "VERSION_PATCH=$PATCH" >> $GITHUB_OUTPUT
          echo "Version: v$NEW_VERSION (next tag was ${LATEST_TAG:-none})"
        shell: bash

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/web:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/web:latest

      - name: Build & push ingestion
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ingestion
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/ingestion:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/ingestion:latest

      - name: Build & push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.migrate
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/migrate:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/migrate:latest

      # ── Sync Helm values with the newly built image version ──────────────
      - name: Checkout again (fresh state)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm values with new image tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VALUES_FILE="helm/recing/values.yaml"

          # Use sed to update the image.tag and migrate.tag in values.yaml
          # We target the specific lines that set "tag: latest"
          sed -i 's/^  tag: latest$/  tag: '"$VERSION"'/' "$VALUES_FILE"
          sed -i '/^migrate:/,/^[^ ]/{ s/^  tag: latest$/  tag: '"$VERSION"'/ }' "$VALUES_FILE"

          echo "Updated values.yaml to image.tag=$VERSION, migrate.tag=$VERSION"
          cat "$VALUES_FILE"

      - name: Commit & push updated Helm values
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/recing/values.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit (values already at this version)."
          else
            git commit -m "chore(helm): bump image tags to v${VERSION} [skip ci]"
            git push origin main
          fi
        shell: bash

      - name: Create & push version tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION} — images: web, ingestion, migrate @ ${VERSION}"
          git push origin "v${VERSION}"
