<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${extraction.recipeName != null ? extraction.recipeName + ' — Recing' : 'Recipe Result — Recing'}">Recipe Result</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
        a.back { display: inline-block; margin-bottom: 1rem; color: #2563eb; text-decoration: none; }
        a.back:hover { text-decoration: underline; }
        h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
        .meta { color: #6b7280; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .section { margin-bottom: 1.25rem; }
        .section h2 { font-size: 1.1rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.3rem; margin-bottom: 0.5rem; }
        ul.ingredients-list { list-style: disc; padding-left: 1.5rem; }
        ol.instructions-list { padding-left: 1.5rem; }
        ol.instructions-list li { margin-bottom: 0.4rem; line-height: 1.5; }
        .unusable { background: #fef3c7; border: 1px solid #fcd34d; color: #92400e; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; }
        .metadata { font-size: 0.8rem; color: #9ca3af; margin-top: 2rem; border-top: 1px solid #f3f4f6; padding-top: 0.5rem; }
        table.meta-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        table.meta-table th, table.meta-table td { text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid #f3f4f6; }
    </style>
</head>
<body>

<a class="back" href="/">&larr; Submit another URL</a>

<!-- Unusable page -->
<div th:if="${extraction.status == 'unusable'}" class="unusable">
    <h2>No Recipe Found</h2>
    <p th:text="${extraction.unusableReason}"></p>
</div>

<!-- Valid extraction -->
<div th:if="${extraction.status != 'unusable'}">
    <h1 th:text="${extraction.recipeName}">Recipe Name</h1>
    <div class="meta" th:if="${extraction.description != null && !extraction.description.isBlank()}" th:text="${extraction.description}"></div>

    <!-- Time info -->
    <div class="section" th:if="${(extraction.prepTime != null && !extraction.prepTime.isBlank()) or (extraction.cookTime != null && !extraction.cookTime.isBlank()) or (extraction.totalTime != null && !extraction.totalTime.isBlank())}">
        <span th:if="${extraction.prepTime != null && !extraction.prepTime.isBlank()}" th:text="'Prep: ' + extraction.prepTime"></span>
        <span th:if="${(extraction.prepTime != null && !extraction.prepTime.isBlank()) and (extraction.cookTime != null && !extraction.cookTime.isBlank())}">
            &middot;
        </span>
        <span th:if="${extraction.cookTime != null && !extraction.cookTime.isBlank()}" th:text="'Cook: ' + extraction.cookTime"></span>
        <span th:if="${extraction.totalTime != null && !extraction.totalTime.isBlank()}">
            , Total: <span th:text="${extraction.totalTime}"></span>
        </span>
    </div>

    <!-- Servings -->
    <p class="meta" th:if="${extraction.servings != null && !extraction.servings.isBlank()}">
        Servings: <span th:text="${extraction.servings}"></span>
    </p>

    <!-- Ingredients -->
    <div class="section" th:if="${!extraction.ingredients.isEmpty()}">
        <h2>Ingredients</h2>
        <ul class="ingredients-list">
            <li th:each="ing : ${extraction.ingredients}" th:text="${ing.originalText != null && !ing.originalText.isBlank() ? ing.originalText : ing.name}"></li>
        </ul>
    </div>

    <!-- Instructions -->
    <div class="section" th:if="${!extraction.instructions.isEmpty()}">
        <h2>Instructions</h2>
        <ol class="instructions-list">
            <li th:each="inst : ${extraction.instructions}">
                Step <span th:text="${inst.stepNumber}"></span>: <span th:text="${inst.text}"></span>
            </li>
        </ol>
    </div>
</div>

<!-- LLM metadata (debug) -->
<div class="metadata" th:if="${llmMetadata != null}">
    <table class="meta-table">
        <tr><th>Model</th><td th:text="${llmMetadata.model}"></td></tr>
        <tr><th>Duration</th><td th:text="${llmMetadata.durationMs + ' ms'}"></td></tr>
        <tr><th>Prompt tokens</th><td th:text="${llmMetadata.promptTokens}"></td></tr>
        <tr><th>Completion tokens</th><td th:text="${llmMetadata.completionTokens}"></td></tr>
        <tr><th>Tokens / sec</th><td><span th:text="${#numbers.formatDecimal(llmMetadata.tokensPerSecond(), 1, 2)}" th:if="${llmMetadata.tokensPerSecond() > 0}"></span><span th:if="${llmMetadata.tokensPerSecond() == 0}">—</span></td></tr>
    </table>
</div>

</body>
</html>
