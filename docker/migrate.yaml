apiVersion: batch/v1
kind: Job
metadata:
  name: recing-migrate
  labels:
    app: recing-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: recing-migrate
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: ghcr.io/elegy00/recing/migrate:latest
        imagePullPolicy: Always
        env:
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: recing-secrets
              key: postgres-url
        resources:
          requests:
            memory: 64Mi
            cpu: 25m
          limits:
            memory: 256Mi
            cpu: 200m
