# ── Images ─────────────────────────────────────────────────────
image:
  registry: ghcr.io/elegy00/recing
  tag: 0.0.4
  pullPolicy: Always

# Migrate image is built separately (Dockerfile.migrate)
migrate:
  tag: 0.0.4

# ── Web ─────────────────────────────────────────────────────────
web:
  replicaCount: 1
  port: 3000
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m

# ── Ingestion ───────────────────────────────────────────────────
ingestion:
  replicaCount: 1
  llmModel: "qwen3.6"
  maxContentChars: "60000"
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m

# ── PostgreSQL (in-cluster) ─────────────────────────────────────
# Set enabled: false to use an external database and provide
# secrets.postgresUrl explicitly.
postgres:
  enabled: true
  user: recing
  password: recing
  database: recing
  storage: 5Gi
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m

# ── Secrets ─────────────────────────────────────────────────────
# Override via --set or a private -f values file; never commit real values.
secrets:
  apiKey: ""
  llmEndpoint: ""
  # Leave empty to auto-derive from postgres values above.
  # Set explicitly when postgres.enabled is false.
  postgresUrl: ""

# ── Traefik (k3s embedded) ──────────────────────────────────────
# Adds custom entry-points to k3s's built-in Traefik via a
# pre-install/pre-upgrade hook that patches the traefik-opts ConfigMap.
traefik:
  enabled: false                                # set true to add extra entry-points
  extraEntryPoints:
    - name: web-alt                             # internal name (referenced in ingress annotations)
      address: ":5399"                          # port Traefik listens on externally
#   You can add more, e.g. an HTTPS entry-point:
#     - name: websecure-custom
#       address: ":8443"
#
# After enabling this, update ingress annotations to reference the new
# entry-point(s), e.g.:
#   traefik.ingress.kubernetes.io/router.entrypoints: web,web-alt

ingress:
  enabled: true
  host: recing.home.arpa                        # primary FQDN (DNS must resolve)
  additionalHosts:
    - bitfarm                                     # k8s node hostname (add /etc/hosts or DNS if needed)
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
