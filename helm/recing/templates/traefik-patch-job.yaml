{{- if .Values.traefik.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-traefik-patch
  namespace: kube-system
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-failed
spec:
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-traefik-patch-sa
      restartPolicy: Never
      containers:
        - name: patch
          image: bitnami/kubectl:1.31
          command: ["/bin/sh", "/scripts/patch.sh"]
          env:
            # In-cluster auth: point kubectl at the API server and our mounted CA/token
            - name: KUBERNETES_SERVICE_HOST
              value: "127.0.0.1"
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
            - name: KUBECONFIG
              value: /dev/null
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: {{ .Release.Name }}-traefik-patch-script
{{- end }}
