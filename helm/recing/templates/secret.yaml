apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "recing.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.secrets.apiKey | quote }}
  llm-endpoint: {{ required "secrets.llmEndpoint is required" .Values.secrets.llmEndpoint | quote }}
  postgres-url: {{ include "recing.postgresUrl" . | quote }}
